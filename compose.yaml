name: case4
services:
  backend:
    build: ./backend
    environment:
      DB_PATH: /data/metrics.db
      WARNING_AFTER: ${WARNING_AFTER:-10}
      OFFLINE_AFTER: ${OFFLINE_AFTER:-20}
      ALERT_AFTER_OFFLINE: ${ALERT_AFTER_OFFLINE:-10}
      CHECK_PERIOD: ${CHECK_PERIOD:-5}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - monitoring-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
  generator:
    build: ./mock-data
    profiles: [demo]
    environment:
      INGEST_URL: http://backend:8000/api/v1/ingest
      PYTHONUNBUFFERED: 1
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  monitoring-data:
